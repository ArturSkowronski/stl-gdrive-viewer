name: Rebuild gallery from scratch

# Manual-only escape hatch: ignore the incremental cache, walk Drive end
# to end, re-pick every cover, regenerate every thumb, and write a fresh
# site/manifest.json. Use this when:
#   - you've changed selector/walker heuristics and want them applied to
#     models that are already in the cached manifest,
#   - covers / STL lists for existing models have changed on Drive (new
#     presupported variants, new beauty shots),
#   - the cache itself looks suspect.
# The fresh state is saved back to the same actions/cache key the daily
# refresh restores from, so the next refresh resumes from this baseline.

on:
  schedule:
    # 02:00 UTC every Sunday — same nightly window as the daily
    # incremental, just on the day we want a from-scratch rebuild.
    # The fresh state lands in the same `gallery-state-*` cache so
    # Monday's refresh resumes from this baseline.
    - cron: "0 2 * * 0"
  workflow_dispatch:
    inputs:
      root_folder_id:
        description: "Drive folder ID to scan (overrides GDRIVE_ROOT_FOLDER_ID variable)."
        required: false
        type: string
        default: "15F2OsqqekNu3C8MpdhMtsAcuZl5OwCDX"
      limit:
        description: "Limit to first N models (debug, leave empty for all)"
        required: false
        type: string

permissions:
  contents: read
  pages: write
  id-token: write

# Share the concurrency group with `Refresh gallery` so a manual rebuild
# can't race a scheduled refresh into the same Pages deployment slot.
concurrency:
  group: pages-refresh
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: "pip"
          cache-dependency-path: scanner/requirements.txt

      - name: Install deps
        run: pip install -r scanner/requirements.txt

      - name: Restore previous gallery state (for Telegram carry-forward only)
        uses: actions/cache/restore@v4
        with:
          path: |
            site/manifest.json
            site/thumbs
          key: gallery-state-${{ github.run_id }}
          restore-keys: |
            gallery-state-

      - name: Drop Drive-source state, keep Telegram entries
        run: |
          # Drive entries are re-derived from scratch by the scanner.
          # Telegram entries live behind tg:* ids and are carried forward
          # by scan.py reading the still-on-disk manifest.json. We delete
          # only thumbs that no Telegram model would reference; the
          # scanner's orphan-prune cleans up anything stale at the end.
          if [ -f site/manifest.json ]; then
            python - <<'PY'
          import json, pathlib
          p = pathlib.Path("site/manifest.json")
          data = json.loads(p.read_text(encoding="utf-8"))
          data["models"] = [m for m in data.get("models", []) if m.get("id", "").startswith("tg:")]
          p.write_text(json.dumps(data, indent=2, ensure_ascii=False))
          PY
          fi

      - name: Scan Drive and build manifest (full)
        env:
          GOOGLE_API_KEY: ${{ secrets.GOOGLE_API_KEY }}
          GOOGLE_OAUTH_CLIENT_ID: ${{ secrets.GOOGLE_OAUTH_CLIENT_ID }}
          GOOGLE_OAUTH_CLIENT_SECRET: ${{ secrets.GOOGLE_OAUTH_CLIENT_SECRET }}
          GOOGLE_OAUTH_REFRESH_TOKEN: ${{ secrets.GOOGLE_OAUTH_REFRESH_TOKEN }}
          ROOT_FOLDER_ID: ${{ inputs.root_folder_id || vars.GDRIVE_ROOT_FOLDER_ID || '15F2OsqqekNu3C8MpdhMtsAcuZl5OwCDX' }}
          LIMIT: ${{ inputs.limit }}
          TELEGRAM_CHANNEL: ${{ vars.TELEGRAM_CHANNEL }}
        run: |
          args=(--root "$ROOT_FOLDER_ID" -v --out site/manifest.json --thumbs site/thumbs)
          if [ -n "$LIMIT" ]; then
            args+=(--limit "$LIMIT")
          fi
          if [ -n "$TELEGRAM_CHANNEL" ]; then
            # Telegram is always lightweight (first-page only). The
            # Sunday rebuild doesn't deep-walk the channel either —
            # carrying TG entries forward via the cached manifest is
            # how older posts survive.
            args+=(--telegram-channel "$TELEGRAM_CHANNEL")
          fi
          # Note: no --incremental — every Drive model is re-scored
          # from scratch. Telegram entries are carried forward through
          # the cache regardless of the Drive flag.
          python -m scanner.scan "${args[@]}"

      - name: Save fresh gallery state for next refresh
        if: success()
        uses: actions/cache/save@v4
        with:
          path: |
            site/manifest.json
            site/thumbs
          key: gallery-state-${{ github.run_id }}

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
