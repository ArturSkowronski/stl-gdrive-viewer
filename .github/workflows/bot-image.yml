name: Build bot image

# Builds the Telegram→Drive bot image and pushes it to GHCR.
# Pull on the Pi with:
#   docker pull ghcr.io/arturskowronski/stl-gdrive-viewer-bot:latest

on:
  push:
    branches: [main]
    paths:
      - "bot/**"
      - ".github/workflows/bot-image.yml"
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up QEMU (cross-compile for ARM64)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: bot/
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/arturskowronski/stl-gdrive-viewer-bot:latest
            ghcr.io/arturskowronski/stl-gdrive-viewer-bot:${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
